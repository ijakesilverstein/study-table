name: Check source and lessons
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m pip install -r requirements-test.txt
      - run: npx playwright install --with-deps chromium
      - name: Rebuild HTML on this temporary validation branch
        run: python3 scripts/build.py
      - name: Commit reproducibly generated standalone HTML for the verified text-wrap fix
        if: github.ref == 'refs/heads/fix/v132-resume-regression' && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/study-table-v132.html public/quality-plan.html
          if ! git diff --cached --quiet; then
            git commit -m 'Rebundle V132 with phone-safe product-rule text layout'
            git push origin HEAD:fix/v132-resume-regression
          fi
      - name: Exercise legacy reader resume before full regression
        run: node qa/test-curriculum-edit.cjs
      - name: Inspect narrow-screen lesson references before full regression
        run: node qa/test-lesson-revisions.cjs
      - run: npm test
      - name: Prepare downloadable HTML and ZIP
        run: python3 scripts/package-downloads.py --output "$RUNNER_TEMP/study-table-downloads"
      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: study-table-downloads
          path: |
            ${{ runner.temp }}/study-table-downloads/public/Study_Table_V*.html
            ${{ runner.temp }}/study-table-downloads/public/Study_Table_V*.zip
          if-no-files-found: error
          retention-days: 30
