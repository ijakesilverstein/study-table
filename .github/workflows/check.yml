name: Check source and lessons
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m pip install -r requirements-test.txt
      - run: npx playwright install --with-deps chromium
      - name: Build fresh V133 HTML directly from the source
        run: python3 scripts/build.py
      - name: Verify 42 independently checked practice problems
        run: node qa/check-transfer-v133.cjs
      - name: Verify real learner practice and review flows
        run: node qa/test-transfer-v133.cjs
      - name: Upload V133 beta preview
        uses: actions/upload-artifact@v4
        with:
          name: study-table-v133-preview-html
          path: public/study-table-v133.html
          retention-days: 30
          if-no-files-found: error
      - run: npm test
      - name: Prepare downloadable HTML and ZIP
        run: python3 scripts/package-downloads.py --output "$RUNNER_TEMP/study-table-downloads"
      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: study-table-downloads
          path: |
            ${{ runner.temp }}/study-table-downloads/public/Study_Table_V*.html
            ${{ runner.temp }}/study-table-downloads/public/Study_Table_V*.zip
          if-no-files-found: error
          retention-days: 30
