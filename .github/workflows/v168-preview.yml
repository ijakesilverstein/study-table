name: V168 source-backed release candidate
on:
  push:
    branches:
      - feature/v168-story-matched-teachback
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 -m pip install -r requirements-test.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify canonical production V136 is unchanged
        run: python3 scripts/build.py --check
      - name: Build the optional V163–V168 learning previews from source
        run: |
          python3 scripts/build-v163.py
          python3 scripts/build-v164.py
          python3 scripts/build-v165.py
          python3 scripts/build-v166.py
          python3 scripts/build-v167.py
          python3 scripts/build-v168.py
          python3 scripts/build-v168.py --check
      - name: Run inherited Study Table regression suite
        run: npm test
      - name: Verify story matches and preservation of 208 archive pages
        run: python3 qa/check-v168.py
      - name: Test all 87 lesson prompts and 52 checked variants in Chromium
        run: node qa/test-v168-browser.cjs
      - name: Verify release packaging uses the tested V168 HTML
        run: |
          python3 scripts/build-v168-release.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('public')
          assert (root/'index.html').read_bytes() == (root/'study-table-v168.html').read_bytes()
          assert (root/'study-table-latest.html').read_bytes() == (root/'study-table-v168.html').read_bytes()
          assert (root/'study-table-v136.html').is_file()
          print('Release smoke PASS: V168 homepage and backup V136 intact')
          PY
      - name: Upload standalone preview only (not production)
        uses: actions/upload-artifact@v4
        with:
          name: study-table-v168-story-matched-teachback
          path: public/study-table-v168.html
          if-no-files-found: error
          retention-days: 30